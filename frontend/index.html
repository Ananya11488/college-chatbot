<!DOCTYPE html>
<html>
<head>
    <title>AI Student Assistant</title>

    <style>
        
body {
    font-family: 'Segoe UI', sans-serif;
    background: linear-gradient(135deg, #667eea, #764ba2);
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;
}
.suggestion {
    background: white;
    border: 1px solid #e5e7eb;
    border-radius: 12px;
    padding: 12px;
    margin: 8px auto;
    width: fit-content;
    cursor: pointer;
    transition: 0.2s;
}

.suggestion:hover {
    transform: translateY(-2px);
    box-shadow: 0 4px 10px rgba(0,0,0,0.1);
}

#chatbox {
    width: 950px;
    height: 85vh;
    background: white;
    border-radius: 20px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.2);
    display: flex;
    flex-direction: column;
    overflow: hidden;
}

#header {
    background: linear-gradient(90deg, #5a67d8, #7c3aed);
    color: white;
    padding: 18px 24px;
    font-size: 22px;
    font-weight: 600;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

#toggleHistory {
    background: white;
    color: #5a67d8;
    border: none;
    border-radius: 20px;
    padding: 8px 14px;
    font-size: 13px;
    cursor: pointer;
    font-weight: 600;
}

#messages {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    background: #f8fafc;
}

#historyMessages {
    margin-bottom: 10px;
}

.message {
    max-width: 80%;
    padding: 14px 18px;
    margin: 12px 0;
    border-radius: 18px;
    line-height: 1.6;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    word-wrap: break-word;
}

.user {
    background: #5a67d8;
    color: white;
    margin-left: auto;
}

.bot {
    background: white;
    color: #333;
    border: 1px solid #e5e7eb;
    margin-right: auto;
}

.timestamp {
    font-size: 11px;
    opacity: 0.7;
    margin-top: 6px;
}

.typing {
    font-size: 13px;
    font-style: italic;
    color: #6b7280;
    margin: 8px 0;
}

#inputArea {
    display: flex;
    gap: 10px;
    padding: 16px;
    background: white;
    border-top: 1px solid #e5e7eb;
}

input {
    flex: 1;
    padding: 14px 18px;
    border-radius: 25px;
    border: 1px solid #d1d5db;
    font-size: 15px;
    outline: none;
}

input:focus {
    border-color: #5a67d8;
}

button.send {
    padding: 14px 24px;
    border-radius: 25px;
    border: none;
    background: #5a67d8;
    color: white;
    font-weight: 600;
    cursor: pointer;
}

button.send:hover {
    background: #4c57c7;
}

#welcome {
    text-align: center;
    margin-top: 60px;
    color: #6b7280;
}

#welcome h2 {
    color: #5a67d8;
    margin-bottom: 15px;
}

.message h1,
.message h2,
.message h3 {
    margin-bottom: 10px;
}

.message ul {
    padding-left: 20px;
}

.message li {
    margin-bottom: 6px;
}

.message p {
    margin: 8px 0;
}
</style>
</head>
<body>

<div id="chatbox">

    <div id="header">
        <span> AI Student Assistant</span>
        <button id="toggleHistory" onclick="toggleHistory()">Show Chat History</button>
    </div>

    <div id="messages">
        <div id="historyMessages" style="display:none;"></div>
        <div id="liveMessages">

        <div id="welcome">
            <h2>🎓 AI Student Assistant</h2>

            <p>Try asking:</p>
            <div class="suggestion"
            onclick="fillPrompt('Explain normalization in DBMS')">
            📚 Explain normalization in DBMS
            </div>

            <div class="suggestion"
            onclick="fillPrompt('How do I get internships?')">
            💼 How do I get internships?
            </div>

            <div class="suggestion"
            onclick="fillPrompt('Create a DBMS study plan')">
            📅 Create a DBMS study plan
            </div>
        </div>

        </div>
    </div>

    <div id="inputArea">
        <input id="userInput"
               placeholder="Type a message..."
               onkeydown="if(event.key==='Enter') sendMessage()" />
        <button class="send" onclick="sendMessage()">Send</button>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script>
    function fillPrompt(text) {
    document.getElementById("userInput").value = text;
}
    let historyVisible = false;

    function getTime() {
        return new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    }

    function getTimeFromISO(iso) {
        return new Date(iso).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    }

    async function toggleHistory() {
        const historyDiv = document.getElementById("historyMessages");
        const button = document.getElementById("toggleHistory");
        const messages = document.getElementById("messages");
        button.disabled = true;

        historyVisible = !historyVisible;

        if (historyVisible) {
            const res = await fetch("http://127.0.0.1:8000/history");
            const chats = await res.json();

            historyDiv.innerHTML = "";
            if (chats.length === 0) {
            historyDiv.innerHTML = `<div class="typing">No chat history yet</div>`;
        } else {
            chats.reverse().forEach(chat => {
                historyDiv.innerHTML += `
                    <div class="message user">
                        ${chat.user_message}
                        <div class="timestamp">${getTimeFromISO(chat.timestamp)}</div>
                    </div>
                    <div class="message bot">
                        ${marked.parse(chat.bot_reply)}
                        <div class="timestamp">${getTimeFromISO(chat.timestamp)}</div>
                    </div>
                `;
            });
           }
            historyDiv.style.display = "block";
            button.innerText = "Hide Chat History";
            

        } else {
            historyDiv.style.display = "none";
            button.innerText = "Show Chat History";
            
        }
        button.disabled = false;
    }

    async function sendMessage() {
        const input = document.getElementById("userInput");
        const live = document.getElementById("liveMessages");
        const message = input.value.trim();
        if (!message) return;
        const welcome = document.getElementById("welcome");
        if (welcome) {
            welcome.remove();
        }

        live.innerHTML += `
            <div class="message user">
                ${message}
                <div class="timestamp">${getTime()}</div>
            </div>
        `;

        input.value = "";
        live.scrollIntoView(false);

        const typing = document.createElement("div");
        typing.className = "typing";
        typing.innerText = "Bot is typing...";
        live.appendChild(typing);

        const res = await fetch("http://127.0.0.1:8000/chat", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ message })
        });

        const data = await res.json();
        typing.remove();

        live.innerHTML += `
            <div class="message bot">
               ${marked.parse(data.reply)}
               <div class="timestamp">${getTime()}</div>
            </div>
`       ;

        live.scrollIntoView(false);
    }
</script>

</body>

</html>
